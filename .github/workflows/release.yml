# The player's downloads (docs/release.md). A tag like v0.2.0 builds the game on Windows, macOS and Linux
# (tools/package.mjs) and puts the three downloads on a GitHub Release. "Run workflow" by hand builds them
# as test downloads on the run's page only, with no Release.
name: Release downloads

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pack:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install
        run: |
          npm ci --no-audit --no-fund
          npm --prefix client ci --no-audit --no-fund
          npm --prefix server ci --no-audit --no-fund
      - name: Build and pack
        id: pack
        shell: bash
        env:
          SCHELDEMIST_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || format('test-{0}', github.run_number) }}
        run: node tools/package.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: download-${{ matrix.os }}
          path: ${{ steps.pack.outputs.archive }}
          compression-level: 0
          retention-days: 14

  release:
    if: github.ref_type == 'tag'
    needs: pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: downloads
          merge-multiple: true
      - name: Make the Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          pre=""
          case "$TAG" in *-*) pre="--prerelease" ;; esac
          gh release create "$TAG" downloads/* --title "Scheldemist $TAG" --notes-file tools/release/notes.md --generate-notes $pre
