name: Native Windows artifacts

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Install Godot Mono editor and export templates
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $base = 'https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable'
          $editorZip = Join-Path $env:RUNNER_TEMP 'godot.zip'
          $templateZip = Join-Path $env:RUNNER_TEMP 'templates.zip'
          Invoke-WebRequest "$base/Godot_v4.7.2-stable_mono_win64.zip" -OutFile $editorZip
          Invoke-WebRequest "$base/Godot_v4.7.2-stable_mono_export_templates.tpz" -OutFile $templateZip
          $editor = Join-Path $env:RUNNER_TEMP 'godot-editor'
          $templates = Join-Path $env:RUNNER_TEMP 'godot-templates'
          Expand-Archive -LiteralPath $editorZip -DestinationPath $editor
          Expand-Archive -LiteralPath $templateZip -DestinationPath $templates
          $target = Join-Path $env:APPDATA 'Godot/export_templates/4.7.2.stable.mono'
          [void](New-Item -ItemType Directory -Path $target -Force)
          Copy-Item -Path (Join-Path $templates 'templates/*') -Destination $target -Recurse
          $engine = Get-ChildItem -LiteralPath $editor -Recurse -File -Filter '*_console.exe' | Select-Object -First 1 -ExpandProperty FullName
          if(-not $engine){throw 'Godot Mono console executable is missing.'}
          "GODOT=$engine" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Check retained native rule fixtures
        shell: pwsh
        run: |
          ./native-godot/services/check-market.ps1
          if($LASTEXITCODE -ne 0){throw 'Native market proof failed.'}
      - name: Export and verify native client and server
        shell: pwsh
        run: |
          $client = Join-Path $env:RUNNER_TEMP 'scheldemist-client'
          $server = Join-Path $env:RUNNER_TEMP 'scheldemist-server'
          ./native-godot/scripts/export-native-windows.ps1 -Godot $env:GODOT -Output $client
          ./native-godot/scripts/export-native-windows.ps1 -Godot $env:GODOT -Server -Output $server
      # Real menu, rendering, movement and multiplayer proofs run separately on a Vulkan PC.
      - uses: actions/upload-artifact@v4
        with:
          name: scheldemist-windows-client
          path: ${{ runner.temp }}/scheldemist-client
          compression-level: 0
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: scheldemist-windows-server
          path: ${{ runner.temp }}/scheldemist-server
          compression-level: 0
          retention-days: 14
