<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;font:14px var(--font-sans,system-ui);color:var(--foreground,#ddd)}figure{margin:0 0 20px}figcaption{margin:8px 0;color:var(--muted-foreground,#888)}img{display:block;width:100%;border-radius:var(--radius,8px)}.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}.label{font-weight:600;margin:8px 0}details{margin:14px 0}summary{cursor:pointer}button{font:inherit;cursor:pointer;padding:8px 14px;border:1px solid var(--border,#555);border-radius:var(--radius,8px);color:inherit;background:var(--secondary,#333)}.full{grid-template-columns:1fr}@media(max-width:480px){.pair{grid-template-columns:1fr}}</style></head><body><button onclick="document.querySelectorAll('.pair').forEach(e=>e.classList.toggle('full'))">Toggle large pictures</button><p class="label">Docks · native Godot, daylight</p><div class="pair"><figure><img src="before/dock-reverse-day.png" alt="Docks Before"><figcaption>Before</figcaption></figure><figure><img src="final/dock-reverse-day.png" alt="Docks After"><figcaption>After</figcaption></figure></div><p class="label">Schelde · native Godot, daylight</p><div class="pair"><figure><img src="before/schelde-day.png" alt="Schelde Before"><figcaption>Before</figcaption></figure><figure><img src="final/schelde-day.png" alt="Schelde After"><figcaption>After</figcaption></figure></div><details><summary>Generated water target</summary><figure><img src="dock-target.png" alt="Generated water target; not a game screenshot"><figcaption>Generated target, not an in-game capture.</figcaption></figure></details><p>High quality, full reflections. Moving boats and birds can differ between captures. Entrance wall cuts were disabled for this water review.</p></body></html>
