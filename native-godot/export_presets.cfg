[preset.0]

name="Native Windows"
platform="Windows Desktop"
runnable=true
dedicated_server=false
custom_features="native_standalone"
export_filter="all_resources"
include_filter="*.json,*.sql,*.bin,*.gdshaderinc,fonts/*LICENSE*,fonts/*OFL*"
exclude_filter="addons/*,proof/*,recovery/*,recovered/recovery-fixture-*/*,scripts/*,services/fixtures/*,services/proof/*,services/proofs/*,dist/*,world/notes/*,services/coverage.json,services/legacy-routes.json,services/north-network-notes.json,services/north-services-notes.json,src/*/*Proof.cs,src/Recovery/*,src/*/*Recovery.cs,world/data/shared/package.json"
export_path=""
script_export_mode=2

[preset.0.options]

binary_format/embed_pck=false
binary_format/architecture="x86_64"
debug/export_console_wrapper=1
texture_format/s3tc_bptc=true
dotnet/include_scripts_content=false
dotnet/include_debug_symbols=false
dotnet/embed_build_outputs=false
application/product_name="Scheldemist"
application/file_description="Scheldemist Native Godot Game"
application/company_name="Scheldemist"
application/modify_resources=true
codesign/enable=false

